{% extends "base.html" %}
{% block content %}
<h1>{{ page.title }}</h1>
{% if page.body %}<div class="prose">{{ page.body }}</div>{% endif %}
<p><a class="btn" href="{{ page.pdf }}">Download PDF ↗</a></p>
<object class="pdf" data="{{ page.pdf }}" type="application/pdf">
  <p>Your browser can't show the PDF here. <a href="{{ page.pdf }}">Download it instead</a>.</p>
</object>
{% endblock %}
